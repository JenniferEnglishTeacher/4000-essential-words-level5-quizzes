<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>4000 Essential Words Book 5 Unit 5 | MCQ Quiz</title>
<style>
:root{--navy:#183b5e;--gold:#cf9e3e;--green:#24764b;--red:#ae3b31;--paper:#f6f4ef}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#18283a}header{background:var(--navy);color:#fff;padding:17px;display:flex;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:3}h1{font:700 1.1rem Georgia,serif;margin:0}.sub{font-size:.78rem;opacity:.8;margin-top:3px}.score{background:var(--gold);padding:7px 14px;border-radius:20px;font-weight:700;white-space:nowrap}main{max-width:820px;margin:auto;padding:24px 15px 60px}.intro,.card,.result{background:#fff;border-radius:14px;box-shadow:0 4px 20px #183b5e18}.intro{padding:15px 19px;margin-bottom:18px;line-height:1.5}.row{display:flex;justify-content:space-between;font-size:.82rem;color:#657080}.track{height:8px;background:#dce3e9;border-radius:8px;margin:7px 0 18px}.bar{height:100%;background:linear-gradient(90deg,var(--navy),var(--gold));border-radius:8px}.card{padding:26px}.qnum{color:var(--gold);font-size:.78rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase}.question{font-size:1.1rem;line-height:1.7;margin:14px 0 18px}.blank{font-weight:800;color:var(--navy)}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{background:#eef2f6;border:2px solid transparent;border-radius:10px;padding:12px;text-align:left;font-size:.97rem;cursor:pointer}.opt:hover:not(:disabled){border-color:var(--navy)}.opt.correct{background:#d9efdf;border-color:var(--green)}.opt.wrong{background:#f7dad7;border-color:var(--red)}.feedback{display:none;margin-top:16px;padding:14px;border-radius:10px;line-height:1.5}.feedback.show{display:block}.good{background:#eaf7ee;color:#185d39}.bad{background:#fff0ef;color:#8c3029}.cn{color:#70458f;font-weight:650}.next{display:none;margin:17px 0 0 auto;background:var(--navy);color:#fff;border:0;border-radius:9px;padding:11px 20px;font-weight:700;cursor:pointer}.next.show{display:block}.result{display:none;text-align:center;padding:32px 23px}.big{font:700 3rem Georgia,serif;color:var(--navy)}.review{text-align:left;background:#f0f3f6;padding:13px;border-radius:9px;margin:17px 0;line-height:1.5}input{width:100%;padding:11px;margin:5px 0;border:2px solid #d8e0e6;border-radius:8px;font-size:.96rem}.submit,.again{width:100%;border:0;border-radius:9px;padding:12px;margin-top:8px;font-weight:750;cursor:pointer}.submit{background:var(--gold);color:#fff}.again{background:var(--navy);color:#fff}.msg{margin-top:8px}@media(max-width:560px){.options{grid-template-columns:1fr}.card{padding:19px}}
</style></head><body>
<header><div><h1>4000 Essential Words - Book 5, Unit 5</h1><div class="sub">The Magic Computer | 20 Questions</div></div><div class="score" id="score">Score: 0</div></header>
<main><div class="intro"><strong>Unit 5 Vocabulary MCQ</strong><br>Choose the best word for each sentence. Complete the quiz and submit your score to your teacher.</div>
<div class="row"><span id="counter"></span><span id="pct"></span></div><div class="track"><div class="bar" id="bar"></div></div>
<section id="quiz"><div class="card"><div class="qnum" id="qnum"></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><button class="next" id="next" onclick="nextQuestion()">Next question →</button></div></section>
<section class="result" id="result"><div class="big" id="finalScore"></div><h2 id="finalPct"></h2><p id="finalMsg"></p><div class="review" id="review"></div><input id="name" maxlength="60" placeholder="Your full name（姓名）"><input id="sid" maxlength="40" placeholder="Student ID / class number（學號）"><button class="submit" id="submit" onclick="submitScore()">Submit score</button><div class="msg" id="msg"></div><button class="again" onclick="location.reload()">Try again</button></section></main>
<script>
const UNIT=5,TITLE="The Magic Computer",ENDPOINT="https://script.google.com/macros/s/AKfycbyCD78fQsk8mKNTl0fNuRJE6AT0WpS0rAQctBeaDPGoZyd_w3T6MGNJuxnPoBCz9jIb-Q/exec";
const TARGETS=[{"word":"awhile","cat":"adv","def":"For a short time.","cn":"一會兒","q":"Please wait ______ while I finish the report."},{"word":"cyberspace","cat":"n","def":"The imaginary place on the Internet where activities occur.","cn":"網路空間","q":"Messages and websites exist in ______."},{"word":"edit","cat":"v","def":"To correct writing so it is suitable for publication.","cn":"編輯；修改","q":"She asked a friend to ______ her essay."},{"word":"essay","cat":"n","def":"A short piece of writing on a particular subject.","cn":"文章；短論文","q":"The student wrote an ______ about technology."},{"word":"evaluate","cat":"v","def":"To study something so a decision can be made.","cn":"評估","q":"The class will ______ the usefulness of the computer."},{"word":"faint","cat":"v","def":"To lose consciousness and fall down.","cn":"昏倒","q":"She might ______ if she becomes too weak."},{"word":"global","cat":"adj","def":"Happening all around the world.","cn":"全球的","q":"Internet access has become a ______ issue."},{"word":"gymnasium","cat":"n","def":"A building with equipment used for exercise.","cn":"體育館；健身房","q":"He exercised in the school ______."},{"word":"highlight","cat":"v","def":"To mark something with color so it is easy to see.","cn":"標示；強調","q":"Use a yellow pen to ______ the key words."},{"word":"ignorant","cat":"adj","def":"Having no knowledge about something.","cn":"無知的；不了解的","q":"He was ______ about how computers worked."},{"word":"index","cat":"n","def":"An alphabetical list in a book that gives page information.","cn":"索引","q":"She used the ______ to find the correct page."},{"word":"lecture","cat":"n","def":"A long educational speech.","cn":"講座；演講","q":"The professor gave a ______ about world hunger."},{"word":"moral","cat":"n","def":"A lesson or message that a story teaches.","cn":"寓意；道德教訓","q":"The ______ of the story was to treat others kindly."},{"word":"operate","cat":"v","def":"To work, function, or control a machine.","cn":"操作；運作","q":"Can you ______ this new computer?"},{"word":"private","cat":"adj","def":"Used by or belonging to one person or group only.","cn":"私人的；私密的","q":"Do not read the document because it is ______."},{"word":"recent","cat":"adj","def":"Happening a short time ago.","cn":"最近的","q":"A ______ study examined students' Internet use."},{"word":"resolution","cat":"n","def":"A firm personal decision.","cn":"決心；決議","q":"She made a ______ to exercise more often."},{"word":"semester","cat":"n","def":"One portion of a school year.","cn":"學期","q":"The report is due at the end of the ______."},{"word":"typewritten","cat":"adj","def":"Written using a computer or typewriter.","cn":"打字的","q":"The teacher required a neat, ______ report."},{"word":"weird","cat":"adj","def":"Very strange or unusual.","cn":"奇怪的","q":"The computer gave a ______ answer to the question."}],EXTRA=[{"word":"briefly","cat":"adv","def":"For a short period of time.","cn":"短暫地"},{"word":"soon","cat":"adv","def":"After a short time.","cn":"不久"},{"word":"patiently","cat":"adv","def":"In a calm way while waiting.","cn":"耐心地"}],ALL=TARGETS.concat(EXTRA);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
const questions=shuffle(TARGETS).map(function(d){const pool=ALL.filter(function(x){return x.cat===d.cat&&x.word!==d.word});return{answer:d.word,cat:d.cat,q:d.q,def:d.def,cn:d.cn,options:shuffle([d.word].concat(shuffle(pool).slice(0,3)))}})
function validate(){if(TARGETS.length!==20||questions.length!==20||new Set(questions.map(function(q){return q.answer})).size!==20)throw new Error("Invalid question count");questions.forEach(function(q){if(q.options.length!==4||new Set(q.options).size!==4||!q.options.includes(q.answer))throw new Error("Invalid options");q.options.forEach(function(w){const d=ALL.find(function(x){return x.word===w});if(!d||d.cat!==q.cat)throw new Error("Part-of-speech mismatch")})})}validate();
let at=0,score=0,answered=false,start=Date.now();const responses=new Array(20).fill("");
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function render(){const q=questions[at];answered=false;document.getElementById("counter").textContent="Question "+(at+1)+" of 20";document.getElementById("pct").textContent=Math.round(at/20*100)+"%";document.getElementById("bar").style.width=(at/20*100)+"%";document.getElementById("qnum").textContent="Question "+(at+1);document.getElementById("question").innerHTML=esc(q.q).replace(/_{3,}/g,'<span class="blank">________</span>');document.getElementById("options").innerHTML=q.options.map(function(w,i){return'<button class="opt" data-w="'+esc(w)+'" onclick="choose(this.dataset.w,this)"><strong>'+String.fromCharCode(65+i)+".</strong> "+esc(w)+"</button>"}).join("");document.getElementById("feedback").className="feedback";document.getElementById("next").className="next"}
function choose(choice,button){if(answered)return;answered=true;const q=questions[at],ok=choice===q.answer;responses[at]=choice;if(ok)score++;document.getElementById("score").textContent="Score: "+score;document.querySelectorAll(".opt").forEach(function(b){b.disabled=true;if(b.dataset.w===q.answer)b.classList.add("correct");else if(b===button)b.classList.add("wrong")});const f=document.getElementById("feedback");f.className="feedback show "+(ok?"good":"bad");f.innerHTML=(ok?"✓ Correct!":"✗ Correct answer: <strong>"+esc(q.answer)+"</strong>")+"<br>"+esc(q.def)+'<div class="cn">'+esc(q.cn)+"</div>";document.getElementById("next").className="next show"}
function nextQuestion(){at++;if(at<20)render();else finish()}
function finish(){document.getElementById("quiz").style.display="none";document.getElementById("result").style.display="block";document.getElementById("bar").style.width="100%";document.getElementById("pct").textContent="100%";const p=Math.round(score/20*100);document.getElementById("finalScore").textContent=score+" / 20";document.getElementById("finalPct").textContent=p+"%";document.getElementById("finalMsg").textContent=p>=90?"Outstanding!":p>=75?"Great work!":p>=60?"Good effort!":"Review the words and try again.";const wrong=questions.filter(function(q,i){return responses[i]!==q.answer}).map(function(q){return q.answer});document.getElementById("review").innerHTML="<strong>Words to review:</strong> "+(wrong.join(", ")||"none")}
async function submitScore(){const name=document.getElementById("name").value.trim(),sid=document.getElementById("sid").value.trim(),msg=document.getElementById("msg");if(!name||!sid){msg.textContent="Please enter both your name and student ID.";return}const btn=document.getElementById("submit");btn.disabled=true;msg.textContent="Submitting...";const percent=Math.round(score/20*100),secs=Math.round((Date.now()-start)/1000),answers=questions.map(function(q,i){return{question:q.q,selected:responses[i],answer:q.answer,ok:responses[i]===q.answer}}),wrong=answers.filter(function(a){return!a.ok});const payload={testDateTime:new Date().toLocaleString("zh-TW",{timeZone:"Asia/Taipei"}),studentName:name,studentId:sid,unit:String(UNIT),unitName:"Level 5 Unit "+UNIT+" - "+TITLE,score:score,total:20,percentage:percent/100,grade:percent>=90?"A+":percent>=80?"A":percent>=70?"B":percent>=60?"C":"D",timeTaken:Math.floor(secs/60)+"m "+secs%60+"s",answers:answers,wrongAnswers:wrong,wrongWords:Array.from(new Set(wrong.map(function(a){return a.answer}))).join(", ")||"none",lookUpWords:"none"};try{await fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});msg.style.color="var(--green)";msg.textContent="Submitted! "+name+" - "+percent+"%";btn.textContent="Submitted ✓"}catch(e){btn.disabled=false;msg.style.color="var(--red)";msg.textContent="Submission failed. Please try again."}}
render();
</script></body></html>
